# study.example.yaml
# Plantilla pública de configuración para Hermes Study Agent.
# Copiar como config/study.yaml para usar una configuración personal.
# Este archivo no debe contener credenciales ni datos sensibles.

app:
  name: hermes-study-agent
  environment: development
  timezone: America/Argentina/Buenos_Aires

storage:
  database:
    engine: sqlite
    path: storage/study.db

  materials_path: materials
  exports_path: exports
  diagrams_path: diagrams

study:
  default_session:
    target_minutes: 75
    hard_limit_minutes: 90

  checkpoints:
    enabled: true
    intervals_minutes:
      - 25
      - 50

  auto_close_on_hard_limit: true
  restore_last_session: true

  session_summary:
    enabled: true

    include:
      - topics
      - doubts
      - misconceptions
      - progress
      - next_action

subjects:
  enabled: true

  definitions: []

  # Ejemplo futuro:
  #
  # definitions:
  #   - id: physics_2
  #     name: Física II
  #     type: problem_solving
  #
  #   - id: algorithms
  #     name: Algoritmos y Estructuras de Datos
  #     type: programming

  allowed_types:
    - problem_solving
    - programming
    - theoretical
    - mixed
    - memorization
    - language

doubts:
  default_status: pending

  allowed_statuses:
    - pending
    - studying
    - resolved
    - review

  auto_classify: true
  auto_detect_subject: true
  auto_detect_topic: true

knowledge:
  tracking:
    enabled: true

  dimensions:
    - exposure
    - conceptual
    - procedural
    - independent_problem_solving
    - retention

  misconceptions:
    enabled: true
    track_occurrences: true

sources:
  enabled: true
  default_mode: auto

  modes:
    - auto
    - explicit
    - none

  retrieval:
    enabled: true
    max_results: 6
    require_source_when_requested: true

  citations:
    enabled: true

    include:
      - source
      - chapter
      - section
      - page

  original_files_immutable: true
  derived_data_path: storage/source_index

visual:
  enabled: true
  auto_suggest: true

  tools:
    mermaid:
      enabled: true

    graphviz:
      enabled: true

    matplotlib:
      enabled: true

    excalidraw:
      enabled: false

  routing:
    process: mermaid
    architecture: mermaid
    sequence: mermaid

    tree: graphviz
    graph: graphviz
    dag: graphviz

    function: matplotlib
    numeric_data: matplotlib
    study_metrics: matplotlib

    spatial: excalidraw
    physics_geometry: excalidraw

notebooklm:
  enabled: false

  export:
    enabled: true
    path: exports/notebooklm

  integration:
    mode: manual

  study_pack:
    sections:
      - objective
      - concepts
      - sources
      - explanation
      - misconceptions
      - pending_doubts
      - examples
      - review_questions
      - connections

activitywatch:
  enabled: false

  aggregation:
    enabled: true

  metrics:
    - elapsed_minutes
    - focused_minutes
    - idle_minutes
    - distraction_minutes

  send_raw_activity_to_llm: false

whatsapp:
  enabled: false
  mode: self_chat

  allowed_features:
    - capture_doubt
    - quick_query
    - voice_note
    - image
    - notification
    - start_session

remote_access:
  enabled: false

  preferred_network:
    provider: tailscale

  expose_publicly: false

exam_mode:
  enabled: true

  allow_hints: false
  allow_corrections_during_attempt: false
  reveal_solution_before_end: false

  allow:
    - clarify_ambiguous_wording

  post_exam:
    evaluate: true
    classify_errors: true
    update_knowledge: true
    recommend_review: true

privacy:
  store_secrets_in_repository: false
  log_sensitive_data: false
  local_first: true

  private_paths:
    - storage
    - materials

features:
  capture_doubt: true
  study_session: true
  session_summary: true

  timers: true
  checkpoints: true

  source_engine: true
  visual_learning: true

  notebooklm: false
  activitywatch: false
  whatsapp: false
  remote_access: false
  adaptive_learning: false

logging:
  level: INFO

  include:
    - application
    - database
    - session

  exclude:
    - secrets
    - tokens
    - cookies
