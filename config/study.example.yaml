# Plantilla pública; no contiene datos personales ni credenciales.
app:
  name: hermes-study-agent
  timezone: America/Argentina/Buenos_Aires

storage:
  database:
    engine: sqlite
    path: storage/study.db

study:
  default_session:
    target_minutes: 75
    hard_limit_minutes: 90

subjects:
  allowed_types:
    - problem_solving
    - programming
    - theoretical
    - mixed
    - memorization
    - language

doubts:
  default_status: pending
  allowed_statuses:
    - pending
    - studying
    - resolved
    - review
